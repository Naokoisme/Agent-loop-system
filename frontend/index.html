<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Agent-loop 自动化测试平台</title>
  <link rel="stylesheet" href="/assets/styles.css?v=20260826-1">
  <script defer src="/assets/app.js?v=20260826-1"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/tests?view=overview" data-route="/overview" aria-label="返回项目总览">
      <strong>Agent-loop</strong>
      <small id="brand-system-version">v—</small>
    </a>
    <nav class="primary-nav" aria-label="工作台一级导航">
      <a href="/tests?view=overview" data-route="/overview" data-nav="overview"><span aria-hidden="true">⌂</span>项目总览</a>
      <a href="/prd-cases" data-route="/prd-cases" data-nav="prd-cases"><span aria-hidden="true">✦</span>PRD 转用例</a>
      <a href="/tests?view=cases" data-route="/cases" data-nav="cases"><span aria-hidden="true">▤</span>用例管理</a>
      <a href="/tests?view=runs" data-route="/runs" data-nav="runs"><span aria-hidden="true">◉</span>自动化执行</a>
      <a href="/tests?view=reports" data-route="/reports" data-nav="reports"><span aria-hidden="true">▥</span>测试报告</a>
      <a href="/tests?view=defects" data-route="/defects" data-nav="defects"><span aria-hidden="true">◴</span>ONES 缺陷</a>
      <a href="/tests?view=environments" data-route="/environments" data-nav="environments"><span aria-hidden="true">⚙</span>环境中心</a>
    </nav>
    <div class="topbar-actions">
      <button id="update-badge" class="button button-secondary update-badge" type="button" style="display: none;">发现新版本</button>
      <div class="global-target-picker" aria-label="当前项目与快捷切换">
        <button id="global-project-switch" class="global-project-switch" type="button" aria-haspopup="dialog">当前项目：读取中… ▾</button>
        <span id="global-target-status" class="target-health-inline"><i></i><span>尚未检查</span></span>
      </div>
      <button id="open-create-project" class="button button-secondary topbar-create-project" type="button">＋ 新增项目</button>
      <button id="open-system-settings" class="icon-button settings-nav-btn" type="button" aria-label="打开系统设置" title="系统设置">⚙</button>
    </div>
  </header>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-state">
      <div class="spinner"></div>
      <p>正在读取本地数据…</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="project-switch-dialog" class="import-dialog project-switch-dialog" aria-labelledby="project-switch-title">
    <header class="dialog-head">
      <div><p class="eyebrow">快捷切换</p><h2 id="project-switch-title">选择项目</h2></div>
      <button class="dialog-close" type="button" data-close-project-switch aria-label="关闭">×</button>
    </header>
    <div class="dialog-body">
      <label class="project-search"><span class="sr-only">搜索项目</span><input id="project-switch-search" type="search" placeholder="搜索项目名称或 ID" autocomplete="off"></label>
      <div id="project-switch-list" class="project-switch-list"></div>
    </div>
    <footer class="dialog-foot"><button id="project-switch-create" class="button" type="button">＋ 新增项目</button></footer>
  </dialog>
  <dialog id="create-project-dialog" class="import-dialog create-project-dialog" aria-labelledby="create-project-title">
    <form id="create-project-form">
      <header class="dialog-head">
        <div><p class="eyebrow">项目注册表</p><h2 id="create-project-title">新增项目</h2></div>
        <button class="dialog-close" type="button" data-close-create-project aria-label="关闭">×</button>
      </header>
      <div class="dialog-body project-create-fields">
        <label><span>项目名称</span><input name="project_name" required placeholder="例如：579 回归项目"></label>
        <label><span>项目 ID</span><input name="project_id" required pattern="[A-Za-z0-9_.-]+" placeholder="例如：watch_579_regression"></label>
        <fieldset><legend>允许运行平台</legend><div id="create-project-platforms" class="platform-checkboxes"></div></fieldset>
        <label><span>默认运行平台</span><select name="default_platform" id="create-project-default-platform" required></select></label>
        <fieldset><legend>允许执行目标</legend><div id="create-project-targets" class="target-checkboxes"></div></fieldset>
        <label><span>默认执行目标</span><select name="default_target" id="create-project-default-target" required></select></label>
        <p id="create-project-error" class="error-banner" hidden></p>
      </div>
      <footer class="dialog-actions"><button class="button button-secondary" type="button" data-close-create-project>取消</button><button class="button" type="submit">创建并切换</button></footer>
    </form>
  </dialog>
  <dialog id="image-preview-dialog" class="image-preview-dialog" aria-labelledby="image-preview-title">
    <header class="dialog-head image-preview-head">
      <div>
        <p class="eyebrow">图片预览</p>
        <h2 id="image-preview-title">图片预览</h2>
      </div>
      <button id="close-image-preview" class="dialog-close" type="button" aria-label="关闭图片预览">×</button>
    </header>
    <div class="image-preview-stage">
      <img id="image-preview-image" alt="">
    </div>
  </dialog>
  <dialog id="system-settings-dialog" class="import-dialog settings-dialog" aria-labelledby="settings-dialog-title">
    <form id="system-settings-form">
      <header class="dialog-head">
        <div>
          <h2 id="settings-dialog-title">系统设置</h2>
        </div>
        <button id="close-system-settings" class="dialog-close" type="button" aria-label="关闭">×</button>
      </header>

      <div class="settings-tabs-nav">
        <button type="button" class="settings-tab-btn is-active" data-settings-tab="llm">模型服务</button>
        <button type="button" class="settings-tab-btn" data-settings-tab="ones">ONES 平台</button>
        <button type="button" class="settings-tab-btn" data-settings-tab="hardware">真机连接</button>
        <button type="button" class="settings-tab-btn" data-settings-tab="bluetooth">蓝牙工作台</button>
      </div>

      <div class="dialog-body settings-dialog-body">
        <!-- Tab 1: LLM (用户配置服务状态卡片与连通性测试) -->
        <div class="settings-tab-pane" data-settings-pane="llm" style="display: flex; flex-direction: column; gap: 14px;">
          <div class="llm-settings-card">
            <div class="llm-settings-heading">
              <span class="llm-settings-title">
                <span id="llm-engine-dot" class="llm-status-dot" data-tone="neutral"></span>
                模型服务
              </span>
              <span class="chip chip-solidified" style="font-size: 11px;">当前配置</span>
            </div>

            <div class="llm-signal-list" aria-label="模型服务状态">
              <div class="llm-signal-row">
                <span>配置状态</span>
                <strong id="llm-config-status" class="llm-signal-value" data-tone="neutral">读取中…</strong>
              </div>
              <div class="llm-signal-row">
                <span>最近调用</span>
                <strong id="llm-actual-success" class="llm-signal-value" data-tone="neutral">尚无成功记录</strong>
              </div>
              <div class="llm-signal-row is-expanded">
                <span>连接测试</span>
                <div id="llm-test-status" class="llm-test-status" data-tone="neutral" role="status" aria-live="polite">
                  <strong data-llm-test-summary>尚未执行</strong>
                  <small data-llm-test-action hidden></small>
                  <details class="inline-diagnostics" data-llm-test-diagnostics hidden>
                    <summary>诊断信息</summary>
                    <pre><code></code></pre>
                  </details>
                </div>
              </div>
            </div>

            <div class="llm-config-details">
              <span style="color: var(--ink-soft);">模型：</span>
              <span id="llm-display-model" style="font-family: monospace; font-weight: 600;">gpt-5.6-sol</span>
              <span style="color: var(--ink-soft);">服务地址：</span>
              <span id="llm-display-gateway" style="font-family: monospace; font-size: 12px; color: var(--ink-soft);">https://api.onefaka.com/v1</span>
            </div>

            <div class="llm-probe-actions">
              <button id="btn-test-llm" type="button" class="button button-secondary" style="padding: 6px 14px; font-size: 12px; cursor: pointer;">测试连接</button>
              <small>只检查当前连接，不影响已有运行记录。</small>
            </div>
          </div>
        </div>

        <!-- Tab 2: ONES -->
        <div class="settings-tab-pane" data-settings-pane="ones" style="display: none; flex-direction: column; gap: 12px;">
          <div>
            <label for="cfg-ones-base-url" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">ONES 地址</label>
            <input id="cfg-ones-base-url" type="text" class="input" placeholder="https://ones.topstepht.com:8443" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
          </div>
          <div style="display: flex; gap: 12px;">
            <div style="flex: 1;">
              <label for="cfg-ones-email" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">账号（邮箱）</label>
              <input id="cfg-ones-email" type="text" class="input" placeholder="例如：name@topstep-tech.com" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
            </div>
            <div style="flex: 1;">
              <label for="cfg-ones-password" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">密码</label>
              <input id="cfg-ones-password" type="password" class="input" placeholder="ONES 密码" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <button id="btn-ones-login" type="button" class="button button-primary" style="padding: 6px 14px; font-size: 12px; font-weight: bold; cursor: pointer;">登录并保存</button>
            <span id="ones-login-status" style="font-size: 12px; color: var(--ink-soft);"></span>
          </div>

          <details style="margin-top: 4px; padding: 8px 12px; background: var(--surface-soft); border-radius: 6px; border: 1px solid var(--line);">
            <summary style="font-size: 12px; font-weight: bold; cursor: pointer; color: var(--ink-soft);">高级设置</summary>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
              <div>
                <label for="cfg-ones-auth-token" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">访问令牌</label>
                <input id="cfg-ones-auth-token" type="password" class="input" placeholder="从 ONES 个人设置获取" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
              </div>
              <div style="display: flex; gap: 12px;">
                <div style="flex: 1;">
                  <label for="cfg-ones-team-uuid" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">团队 UUID</label>
                  <input id="cfg-ones-team-uuid" type="text" class="input" placeholder="团队 UUID" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
                </div>
                <div style="flex: 1;">
                  <label for="cfg-ones-user-id" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">用户 ID</label>
                  <input id="cfg-ones-user-id" type="text" class="input" placeholder="用户 ID" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
                </div>
              </div>
            </div>
          </details>
        </div>

        <!-- Tab 3: Hardware -->
        <div class="settings-tab-pane" data-settings-pane="hardware" style="display: none; flex-direction: column; gap: 12px;">
          <div style="display: flex; gap: 12px;">
            <div style="flex: 1.2;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <label for="cfg-hw-port" style="font-size: 12px; font-weight: bold;">SuperCom 端口</label>
                <button id="btn-refresh-serial-ports" type="button" class="button button-secondary" style="padding: 2px 8px; font-size: 11px; cursor: pointer;" title="刷新串口列表">刷新</button>
              </div>
              <select id="cfg-hw-port" class="select" required style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
                <option value="">正在读取串口…</option>
              </select>
              <div id="cfg-hw-port-status" class="serial-port-status-banner" style="margin-top: 6px; font-size: 11px; line-height: 1.4;"></div>
            </div>
            <div style="flex: 0.8;">
              <label for="cfg-hw-baudrate" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">波特率</label>
              <input id="cfg-hw-baudrate" type="number" class="input" placeholder="1500000" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
            </div>
          </div>
          <div style="display: flex; gap: 12px;">
            <div style="flex: 1;">
              <label for="cfg-hw-transport" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">连接方式</label>
              <select id="cfg-hw-transport" class="select" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
                <option value="supercom">SuperCom（推荐）</option>
                <option value="direct">直接打开串口</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label for="cfg-hw-capture" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">截图方式</label>
              <select id="cfg-hw-capture" class="select" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line);">
                <option value="mtp">通过 USB 获取截图（推荐）</option>
                <option value="ble">通过蓝牙获取截图（实验）</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Tab 4: Bluetooth -->
        <div class="settings-tab-pane settings-bluetooth-pane" data-settings-pane="bluetooth" style="display: none; flex-direction: column;">
          <div id="settings-bluetooth-root" class="settings-bluetooth-root"></div>
        </div>

      </div>

      <div id="settings-error-box" style="display: none; margin: 12px 0 0 0; padding: 8px 12px; border-radius: 4px; background: var(--red-soft); color: var(--red); font-size: 12px;"></div>

      <footer class="dialog-foot" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);">
        <button id="cancel-system-settings" class="button button-secondary" type="button">关闭</button>
        <button id="submit-system-settings" class="button button-primary" type="submit">保存设置</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
