name: Build Whale Pet Android APK
on:
  push:
    branches: [whale-pet-android]
    paths:
      - 'whale-pet/android/**'
      - '.github/workflows/build-whale-pet-android.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: whale-pet/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: whale-pet-debug-apk
          path: whale-pet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
