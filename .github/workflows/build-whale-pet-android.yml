name: Build Whale Pet Android APK
on:
  push:
    branches: [whale-pet-android]
    paths:
      - 'whale-pet/android/**'
      - '.github/workflows/build-whale-pet-android.yml'
  workflow_dispatch:
concurrency:
  group: whale-pet-android-build
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore nine chibi sprite PNGs
        run: |
          set -euo pipefail
          out=whale-pet/android/app/src/main/res/drawable-nodpi
          mkdir -p "$out"
          for source in whale-pet/android/artwork/*.b64; do
            name="$(basename "$source" .b64)"
            base64 --decode "$source" > "$out/$name.png"
          done
          test "$(find "$out" -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      - name: Build
        working-directory: whale-pet/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: whale-pet-debug-apk
          path: whale-pet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Copy APK into downloadable branch path
        if: success()
        continue-on-error: true
        run: |
          mkdir -p whale-pet/download
          cp whale-pet/android/app/build/outputs/apk/debug/app-debug.apk whale-pet/download/whale-pet-debug.apk
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add whale-pet/download/whale-pet-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m "build(whale): publish installable debug APK [skip ci]"
          git push origin HEAD:whale-pet-android
