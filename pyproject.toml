[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-loop-system"
version = "0.4.1"
description = "Agent 自闭环修 bug + Simulator 验证系统"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pillow>=12.3.0",
    "openpyxl>=3.1,<4",
    "bleak>=2.0,<4",
    "protobuf>=6.31,<7",
    "winrt-windows-devices-bluetooth-rfcomm>=3.2,<4",
    "winrt-windows-networking>=3.2,<4",
    "winrt-windows-networking-sockets>=3.2,<4",
]

[project.scripts]
watch-mtp-screenshot = "agent_loop_system.tools.mtp_screenshot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
